syntax = "proto3";

package payment.v1;

option go_package = "paynexus/pkg/genproto/payment/v1;payv1pb";

service PaymentService {
  rpc CreateInvoice (CreateInvoiceRequest) returns (CreateInvoiceResponse);
  rpc GetInvoice (GetInvoiceRequest) returns (GetInvoiceResponse);
}

message Invoice {
  int64 id = 1;
  int64 merchant_id = 2;
  string invoice_code = 3;
  string currency = 4;
  double amount = 5;
  string deposit_address = 6;
  string memo_code = 7;
  string status = 8;
  string expired_at = 9;
  string created_at = 10;
}

message CreateInvoiceRequest {
  int64 merchant_id = 1;
  string currency = 2;
  double amount = 3;
  string order_reference = 4;
}

message CreateInvoiceResponse {
  Invoice invoice = 1;
  bool is_cached_response = 2; // Đánh dấu nếu là kết quả từ Idempotency Cache
}

message GetInvoiceRequest {
  int64 invoice_id = 1;
}

message GetInvoiceResponse {
  Invoice invoice = 1;
}
